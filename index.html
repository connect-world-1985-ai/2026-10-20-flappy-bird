<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4ec0ca">
  <meta name="description" content="Flappy Bird - a simple browser game drawn entirely in code.">
  <title>Flappy Bird</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='30' cy='34' rx='22' ry='18' fill='%23f8d630' stroke='%23533' stroke-width='3'/%3E%3Ccircle cx='40' cy='28' r='7' fill='%23fff' stroke='%23533' stroke-width='2'/%3E%3Ccircle cx='42' cy='28' r='3' fill='%23222'/%3E%3Cpath d='M46 36 L60 38 L46 44 Z' fill='%23f0732b' stroke='%23533' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Flappy Bird game canvas"></canvas>
    <button id="mute" type="button" aria-label="Mute sound" title="Mute (M)">🔊</button>
    <div id="difficulty" role="group" aria-label="Difficulty">
      <button type="button" data-difficulty="easy" aria-pressed="true" title="Easier gaps and slower pipes">Easy</button>
      <button type="button" data-difficulty="normal" aria-pressed="false" title="Original challenge">Normal</button>
    </div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script src="game.js"></script>
</body>
</html>
